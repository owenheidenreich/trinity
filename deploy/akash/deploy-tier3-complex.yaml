version: "2.0"

# ============================================================================
# Trinity Tier 3: Complex Reasoning (Qwen 2.5 72B)
# ============================================================================
# 
# Purpose: Complex reasoning, code generation, multi-step analysis
# Model: Qwen 2.5 72B (40GB+ VRAM required)
# Cost: ~$1.50-2.50/hour (~$1000-1800/month)
# Response Time: 15-45 seconds
# Intelligence: Excellent (best for complex tasks)
#
# GPU Selection: A100 80GB only - required for 72B model
# ============================================================================

services:
  trinity:
    image: gdubx/trinity-inference:v6-sessions
    env:
      - PROVIDER_ID=trinity-tier3-complex
      - MODEL_NAME=qwen2.5:72b
      - MODEL_BACKEND=ollama
      - GPU_TYPE=A100
      - MAX_QUEUE_SIZE=5
      - OLLAMA_HOST=http://localhost:11434
      - LIGHTHOUSE_API_KEY=cac651de.89f60066a4434ee98844288e220ad6dc
      # Deployment tracking (set by deploy script, used for /funding/status)
      - DEPLOYMENT_TIER=3
      - DEPLOYMENT_TIER_NAME=Professional
      - HOURLY_COST_AKT=1.75
      - DAILY_COST_AKT=42.0
      - SESSION_TYPE=community
    expose:
      - port: 8000
        as: 80
        to:
          - global: true
        http_options:
          read_timeout: 180000
          send_timeout: 180000
          max_body_size: 10485760

profiles:
  compute:
    trinity:
      resources:
        cpu:
          units: 16
        memory:
          size: 64Gi
        storage:
          size: 150Gi
        gpu:
          units: 1
          attributes:
            vendor:
              nvidia:

  placement:
    akash:
      pricing:
        trinity:
          denom: uakt
          amount: 50000

deployment:
  trinity:
    akash:
      profile: trinity
      count: 1
