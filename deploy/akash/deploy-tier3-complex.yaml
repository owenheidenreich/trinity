version: "2.0"

# ============================================================================
# Trinity Tier 3: Complex Reasoning (Qwen 2.5 72B)
# ============================================================================
# 
# Purpose: Complex reasoning, code generation, multi-step analysis
# Model: Qwen 2.5 72B (40GB+ VRAM required)
# Cost: ~$1.50-2.50/hour (~$1000-1800/month)
# Response Time: 15-45 seconds
# Intelligence: Excellent (best for complex tasks)
#
# GPU Selection: A100 80GB only - required for 72B model
# ============================================================================

services:
  trinity:
    image: gdubx/trinity-inference:v2-20260126-153616
    env:
      - PROVIDER_ID=trinity-tier3-complex
      - MODEL_NAME=qwen2.5:72b
      - MODEL_BACKEND=ollama
      - GPU_TYPE=A100
      - MAX_QUEUE_SIZE=5
      - OLLAMA_HOST=http://localhost:11434
      - LIGHTHOUSE_API_KEY=cac651de.89f60066a4434ee98844288e220ad6dc
    expose:
      - port: 8000
        as: 80
        to:
          - global: true

profiles:
  compute:
    trinity:
      resources:
        cpu:
          units: 16
        memory:
          size: 128Gi
        storage:
          size: 200Gi
        gpu:
          units: 1
          attributes:
            vendor:
              nvidia:
                - model: a100

  placement:
    akash:
      pricing:
        trinity:
          denom: uakt
          amount: 100000

deployment:
  trinity:
    akash:
      profile: trinity
      count: 1
