version: "2.0"

# ============================================================================
# Trinity Tier 3: Complex Reasoning (Qwen 2.5 32B or 72B)
# ============================================================================
# 
# Purpose: Complex reasoning, code generation, multi-step analysis
# Model: Qwen 2.5 32B (fits on more GPUs) - can upgrade to 72B on A100
# Cost: ~$0.80-1.50/hour (~$600-1000/month)
# Response Time: 10-30 seconds
# Intelligence: Excellent
#
# NOTE: 72B requires A100 80GB which has very limited availability.
#       32B runs on A100 40GB, A6000, or 2x RTX 4090.
#       Edit MODEL_NAME to qwen2.5:72b if you get A100 80GB bids.
#
# Using 48GB RAM and 32B model to increase provider availability.
# ============================================================================

services:
  trinity:
    image: gdubx/trinity-inference:v4-unlimited
    env:
      - PROVIDER_ID=trinity-tier3-complex
      - MODEL_NAME=qwen2.5:32b
      - MODEL_BACKEND=ollama
      - GPU_TYPE=A100
      - MAX_QUEUE_SIZE=5
      - OLLAMA_HOST=http://localhost:11434
      # Multi-Model Architecture (v4.0)
      # FAST_MODEL: Quick classification/routing tasks
      # SMART_MODEL: General purpose balanced reasoning
      # REASONING_MODEL: Complex reasoning (same as MODEL_NAME for Tier 3)
      - MULTI_MODEL_ENABLED=true
      - FAST_MODEL=phi3:mini
      - SMART_MODEL=llama3.1:8b
      - REASONING_MODEL=qwen2.5:32b
      # RAG & Semantic Memory (v4.0)
      - EMBEDDING_MODEL=BAAI/bge-small-en-v1.5
      - RAG_TOP_K=5
      - RAG_CHUNK_SIZE=512
      - RAG_CHUNK_OVERLAP=50
      - WORKING_MEMORY_SIZE=3
      - SEMANTIC_MEMORY_SIZE=5
      - RECENCY_WEIGHT=0.3
      # Tool Use & Code Execution (v4.0)
      - CODE_EXECUTION_ENABLED=true
      - CODE_EXECUTION_TIMEOUT=5
      # Voting (v4.0)
      - VOTING_ENABLED=true
      - VOTING_CANDIDATES=3
      - VOTING_COMPLEXITY_THRESHOLD=7
      # API Keys - SET THESE VIA DEPLOYMENT SCRIPT OR SECRETS
      # SECURITY: Do NOT commit actual API keys to version control
      # These placeholder values must be replaced at deployment time
      - LIGHTHOUSE_API_KEY=${LIGHTHOUSE_API_KEY}
      - BRAVE_SEARCH_API_KEY=${BRAVE_SEARCH_API_KEY}
      # Deployment tracking (set by deploy script, used for /funding/status)
      - DEPLOYMENT_TIER=3
      - DEPLOYMENT_TIER_NAME=Professional
      - HOURLY_COST_AKT=1.00
      - DAILY_COST_AKT=24.0
      - SESSION_TYPE=community
    expose:
      - port: 8000
        as: 80
        to:
          - global: true
        http_options:
          read_timeout: 600000
          send_timeout: 600000
          max_body_size: 52428800

profiles:
  compute:
    trinity:
      resources:
        cpu:
          units: 8
        memory:
          size: 48Gi
        storage:
          size: 100Gi
        gpu:
          units: 1
          attributes:
            vendor:
              nvidia:

  placement:
    akash:
      pricing:
        trinity:
          denom: uakt
          amount: 100000

deployment:
  trinity:
    akash:
      profile: trinity
      count: 1
