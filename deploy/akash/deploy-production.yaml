version: "2.0"

# ============================================================================
# Trinity Production: Qwen3 8B (Reference YAML)
# ============================================================================
#
# NOTE: The deploy script (akash_deploy.py) generates SDL dynamically.
# This file is kept as a reference and for manual deployments.
#
# Model: Qwen3 8B — Q4_K_M quantized (~5GB VRAM)
# Cost: ~$30-150/month
# Response Time: 1-5 seconds
# GPU: Any nvidia GPU with 6GB+ VRAM
#
# Deploy:
#   ./scripts/trinity-deploy-production.sh production
# ============================================================================

services:
  trinity:
    image: gdubx/trinity-inference:v2-20260312-215746
    env:
      - PROVIDER_ID=trinity-production-qwen3-8b
      - MODEL_NAME=qwen3:8b
      - MODEL_BACKEND=llama-server
      - LLAMA_SERVER_CHAT_PORT=8081
      - LLAMA_SERVER_INGEST_PORT=8082
      - CHAT_MODEL=qwen3:8b
      - INGEST_MODEL=qwen3:8b
      - GPU_TYPE=auto
      - CHATS_DIR=/data/chats
      - TZ=UTC
      - MAX_QUEUE_SIZE=5
      # RAG & Semantic Memory
      - EMBEDDING_MODEL=BAAI/bge-small-en-v1.5
      - RAG_TOP_K=5
      - RAG_CHUNK_SIZE=512
      - RAG_CHUNK_OVERLAP=50
      - WORKING_MEMORY_SIZE=5
      - SEMANTIC_MEMORY_SIZE=8
      - PROFILE_TOKEN_BUDGET=2500
      - PROFILE_MAX_FACTS=15
      - RECENCY_WEIGHT=0.3
      # Tool Use & Code Execution
      - CODE_EXECUTION_ENABLED=false
      - CODE_EXECUTION_TIMEOUT=5
      # API Keys - Injected from .env at deployment time
      - LIGHTHOUSE_API_KEY=${LIGHTHOUSE_API_KEY}
      - BRAVE_SEARCH_API_KEY=${BRAVE_SEARCH_API_KEY}
      - HF_TOKEN=${HF_TOKEN}
      # Deployment tracking
      - DEPLOYMENT_TIER=production
      - DEPLOYMENT_TIER_NAME=Production
      - SESSION_TYPE=community
    expose:
      - port: 8000
        as: 80
        to:
          - global: true
        http_options:
          read_timeout: 60000
          send_timeout: 60000
          max_body_size: 52428800

profiles:
  compute:
    trinity:
      resources:
        cpu:
          units: 4
        memory:
          size: 8Gi
        storage:
          - size: 20Gi
        gpu:
          units: 1
          attributes:
            vendor:
              nvidia:
                # Names must match provider capabilities/gpu/vendor/nvidia/model/<name>
                - model: rtx3080
                - model: rtx-3070
                - model: 3090
                - model: 4090
                - model: rtx5090
                - model: t4
                - model: v100
                - model: a4000
                - model: A4000
                - model: a100
                - model: h100
                - model: h200

  placement:
    akash:
      pricing:
        trinity:
          denom: uakt
          amount: 100000

deployment:
  trinity:
    akash:
      profile: trinity
      count: 1
