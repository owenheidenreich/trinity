version: "2.0"

# ============================================================================
# Trinity Production: Qwen2.5-Coder 32B
# ============================================================================
#
# The production deployment. This is the only tier that matters.
#
# Model: Qwen2.5-Coder 32B — 72.9% on Aider benchmark, 128K context
# Cost: ~$0.80-1.50/hour (~$600-1000/month)
# Response Time: 5-20 seconds
# GPU: Fits on A100 40GB, A6000, or RTX 4090 24GB (Q4_K_M ~20GB VRAM)
#
# Deploy:
#   ./scripts/trinity-deploy-production.sh production
# ============================================================================

services:
  trinity:
    image: gdubx/trinity-inference:v2-20260215-194033
    env:
      - PROVIDER_ID=trinity-production-qwen25-coder-32b
      - MODEL_NAME=qwen2.5-coder:32b
      - MODEL_BACKEND=ollama
      - GPU_TYPE=A100
      - MAX_QUEUE_SIZE=5
      - OLLAMA_HOST=http://localhost:11434
      # RAG & Semantic Memory
      - EMBEDDING_MODEL=BAAI/bge-small-en-v1.5
      - RAG_TOP_K=5
      - RAG_CHUNK_SIZE=512
      - RAG_CHUNK_OVERLAP=50
      - WORKING_MEMORY_SIZE=5
      - SEMANTIC_MEMORY_SIZE=8
      - PROFILE_TOKEN_BUDGET=2500
      - RECENCY_WEIGHT=0.3
      # Tool Use & Code Execution
      - CODE_EXECUTION_ENABLED=false
      - CODE_EXECUTION_TIMEOUT=5
      # API Keys - Injected from .env at deployment time
      - LIGHTHOUSE_API_KEY=${LIGHTHOUSE_API_KEY}
      - BRAVE_SEARCH_API_KEY=${BRAVE_SEARCH_API_KEY}
      # Deployment tracking
      - DEPLOYMENT_TIER=production
      - DEPLOYMENT_TIER_NAME=Production
      - HOURLY_COST_AKT=1.00
      - DAILY_COST_AKT=24.0
      - SESSION_TYPE=community
    params:
      storage:
        models:
          mount: /home/trinity/.ollama
          readMode: false
    expose:
      - port: 8000
        as: 80
        to:
          - global: true
        http_options:
          read_timeout: 60000
          send_timeout: 60000
          max_body_size: 52428800

profiles:
  compute:
    trinity:
      resources:
        cpu:
          units: 8
        memory:
          size: 48Gi
        storage:
          - size: 10Gi
          - name: models
            size: 80Gi
            attributes:
              persistent: true
              class: beta3
        gpu:
          units: 1
          attributes:
            vendor:
              nvidia:

  placement:
    akash:
      pricing:
        trinity:
          denom: uakt
          amount: 100000

deployment:
  trinity:
    akash:
      profile: trinity
      count: 1
