version: "2.0"

# ============================================================================
# Trinity: MiniMax M2.5 via vLLM on 4× A100 80GB
# ============================================================================
#
# Model: MiniMax M2.5 (229B MoE, 45.9B active per token)
# Runtime: vLLM with tensor parallelism across 4 GPUs
# Context: 196K tokens per sequence, ~400K total KV cache
# Cost: ~$3,400-3,800/month (4× datacenter GPU)
#
# GPU requirement: 4× NVIDIA A100 80GB or H100 80GB
# Weight storage: ~220GB FP8 safetensors (cached in persistent volume)
#
# DEPLOYMENT:
#   export LIGHTHOUSE_API_KEY=...
#   export BRAVE_SEARCH_API_KEY=...
#   export HF_TOKEN=...
#   akash tx deployment create deploy-m2.5.yaml --from wallet
#
# FIRST START: vLLM downloads ~220GB of model weights from HuggingFace.
# This takes 15-60 minutes depending on network speed. Subsequent starts
# use the persistent volume cache and are ready in 2-5 minutes.
# ============================================================================

services:
  trinity:
    image: gdubx/trinity-inference:v2-20260215-223027
    env:
      - PROVIDER_ID=trinity-m2.5-vllm-4xA100
      - MODEL_BACKEND=vllm
      - MODEL_NAME=MiniMaxAI/MiniMax-M2.5
      - VLLM_MODEL_NAME=MiniMaxAI/MiniMax-M2.5
      - VLLM_PORT=8001
      - TENSOR_PARALLEL_SIZE=4
      - GPU_TYPE=4xA100-80GB
      - MAX_QUEUE_SIZE=5
      # CUDA compat
      - CUDA_MODULE_LOADING=LAZY
      # NCCL: v0.10.0 ships safe NCCL 2.26.2 (no CUDA 13.0 SIGSEGV).
      # P2P ENABLED — A100 SXM4 has NVLink, P2P is the primary transport.
      # SHM disabled because Akash /dev/shm is only 64MB.
      # v11 had P2P_DISABLE=1 which killed all transports → ncclCommInitRank failed.
      - NCCL_SHM_DISABLE=1
      - NCCL_NVLS_ENABLE=0
      - NCCL_CUMEM_ENABLE=0
      - NCCL_P2P_DISABLE=0
      - NCCL_DEBUG=INFO
      # vLLM flags — 32K context fits in 4×A100 after 220GB model weights
      # --enforce-eager disables CUDA graph compilation for reliable multi-GPU init
      # --disable-custom-all-reduce avoids vLLM custom CUDA kernels that also
      #   trigger the cuLibraryLoadData SIGSEGV on CUDA 13.0 drivers
      - VLLM_EXTRA_ARGS=--max-model-len 32768 --gpu-memory-utilization 0.90 --enforce-eager --disable-custom-all-reduce
      # RAG & Semantic Memory
      - EMBEDDING_MODEL=BAAI/bge-small-en-v1.5
      - RAG_TOP_K=5
      - RAG_CHUNK_SIZE=512
      - RAG_CHUNK_OVERLAP=50
      - WORKING_MEMORY_SIZE=3
      - SEMANTIC_MEMORY_SIZE=5
      - RECENCY_WEIGHT=0.3
      # Tool Use & Code Execution
      - CODE_EXECUTION_ENABLED=false
      - CODE_EXECUTION_TIMEOUT=5
      # API Keys — injected from .env at deployment time
      - LIGHTHOUSE_API_KEY=${LIGHTHOUSE_API_KEY}
      - BRAVE_SEARCH_API_KEY=${BRAVE_SEARCH_API_KEY}
      - HUGGING_FACE_HUB_TOKEN=${HF_TOKEN}
      # Deployment tracking (used for /funding/status and /health)
      - DEPLOYMENT_TIER=3
      - DEPLOYMENT_TIER_NAME=M2.5-Professional
      - HOURLY_COST_AKT=5.00
      - DAILY_COST_AKT=120.0
      - SESSION_TYPE=community
    params:
      storage:
        models:
          mount: /models
          readMode: false
    expose:
      - port: 8000
        as: 80
        to:
          - global: true
        http_options:
          read_timeout: 60000
          send_timeout: 60000
          max_body_size: 52428800

profiles:
  compute:
    trinity:
      resources:
        cpu:
          units: 16
        memory:
          size: 64Gi
        storage:
          - size: 10Gi
          - name: models
            size: 500Gi
            attributes:
              persistent: true
              class: beta3
        gpu:
          units: 4
          attributes:
            vendor:
              nvidia:
                - model: a100
                  ram: 80Gi

  placement:
    akash:
      pricing:
        trinity:
          denom: uakt
          amount: 500000

deployment:
  trinity:
    akash:
      profile: trinity
      count: 1
