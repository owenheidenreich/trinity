version: "2.0"

services:
  trinity:
    image: gdubx/trinity-inference:v4-fix
    env:
      - PROVIDER_ID=trinity-tier2-balanced
      - MODEL_NAME=llama3.1:8b
      - MODEL_BACKEND=ollama
      - GPU_TYPE=NVIDIA-GPU
      - MAX_QUEUE_SIZE=10
      - OLLAMA_HOST=http://localhost:11434
      # Multi-Model Architecture (v4.0)
      # FAST_MODEL: Quick classification/routing tasks
      # SMART_MODEL: General purpose (same as MODEL_NAME for Tier 2)
      # REASONING_MODEL: Complex reasoning tasks
      - MULTI_MODEL_ENABLED=true
      - FAST_MODEL=phi3:mini
      - SMART_MODEL=llama3.1:8b
      - REASONING_MODEL=qwen2.5:14b
      # RAG & Semantic Memory (v4.0)
      - EMBEDDING_MODEL=BAAI/bge-small-en-v1.5
      - RAG_TOP_K=5
      - RAG_CHUNK_SIZE=512
      - RAG_CHUNK_OVERLAP=50
      - WORKING_MEMORY_SIZE=3
      - SEMANTIC_MEMORY_SIZE=5
      - RECENCY_WEIGHT=0.3
      # Tool Use & Code Execution (v4.0)
      - CODE_EXECUTION_ENABLED=true
      - CODE_EXECUTION_TIMEOUT=5
      # Voting (v4.0)
      - VOTING_ENABLED=true
      - VOTING_CANDIDATES=3
      - VOTING_COMPLEXITY_THRESHOLD=7
      # API Keys - SET THESE VIA DEPLOYMENT SCRIPT OR SECRETS
      # SECURITY: Do NOT commit actual API keys to version control
      # These placeholder values must be replaced at deployment time
      - LIGHTHOUSE_API_KEY=${LIGHTHOUSE_API_KEY}
      - BRAVE_SEARCH_API_KEY=${BRAVE_SEARCH_API_KEY}
      # Deployment tracking (set by deploy script, used for /funding/status)
      - DEPLOYMENT_TIER=2
      - DEPLOYMENT_TIER_NAME=Standard
      - HOURLY_COST_AKT=0.40
      - DAILY_COST_AKT=9.6
      - SESSION_TYPE=community
    expose:
      - port: 8000
        as: 80
        to:
          - global: true
        http_options:
          read_timeout: 60000
          send_timeout: 60000
          max_body_size: 10485760

profiles:
  compute:
    trinity:
      resources:
        cpu:
          units: 8
        memory:
          size: 32Gi
        storage:
          size: 100Gi
        gpu:
          units: 1
          attributes:
            vendor:
              nvidia:

  placement:
    akash:
      pricing:
        trinity:
          denom: uakt
          amount: 20000

deployment:
  trinity:
    akash:
      profile: trinity
      count: 1
