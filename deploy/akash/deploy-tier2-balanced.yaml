version: "2.0"

services:
  trinity:
    image: gdubx/trinity-inference:v2-20260212-041706
    env:
      - PROVIDER_ID=trinity-tier2-qwen14b
      - MODEL_NAME=qwen2.5:14b
      - MODEL_BACKEND=ollama
      - GPU_TYPE=NVIDIA-GPU
      - MAX_QUEUE_SIZE=10
      - OLLAMA_HOST=http://localhost:11434
      # Multi-Model Architecture (v4.0)
      # Tier 2: Qwen 2.5 14B - Smart model that fits P40 (24GB VRAM)
      - MULTI_MODEL_ENABLED=false
      - FAST_MODEL=qwen2.5:14b
      - SMART_MODEL=qwen2.5:14b
      - REASONING_MODEL=qwen2.5:14b
      # RAG & Semantic Memory (v4.0)
      - EMBEDDING_MODEL=BAAI/bge-small-en-v1.5
      - RAG_TOP_K=5
      - RAG_CHUNK_SIZE=512
      - RAG_CHUNK_OVERLAP=50
      - WORKING_MEMORY_SIZE=3
      - SEMANTIC_MEMORY_SIZE=5
      - RECENCY_WEIGHT=0.3
      # Tool Use & Code Execution (v4.0)
      - CODE_EXECUTION_ENABLED=false
      - CODE_EXECUTION_TIMEOUT=5
      # Voting (v4.0)
      - VOTING_ENABLED=true
      - VOTING_CANDIDATES=3
      - VOTING_COMPLEXITY_THRESHOLD=7
      # API Keys - Injected from .env at deployment time
      - LIGHTHOUSE_API_KEY=${LIGHTHOUSE_API_KEY}
      - BRAVE_SEARCH_API_KEY=${BRAVE_SEARCH_API_KEY}
      # Deployment tracking (set by deploy script, used for /funding/status)
      - DEPLOYMENT_TIER=2
      - DEPLOYMENT_TIER_NAME=Qwen3B-Fast
      - HOURLY_COST_AKT=0.25
      - DAILY_COST_AKT=6
      - SESSION_TYPE=community
    params:
      storage:
        models:
          mount: /home/trinity/.ollama
          readMode: false
    expose:
      - port: 8000
        as: 80
        to:
          - global: true
        http_options:
          read_timeout: 60000
          send_timeout: 60000
          max_body_size: 10485760

profiles:
  compute:
    trinity:
      resources:
        cpu:
          units: 8
        memory:
          size: 16Gi
        storage:
          - size: 10Gi
          - name: models
            size: 40Gi
            attributes:
              persistent: true
              class: beta3
        gpu:
          units: 1
          attributes:
            vendor:
              nvidia:

  placement:
    akash:
      pricing:
        trinity:
          denom: uakt
          amount: 20000

deployment:
  trinity:
    akash:
      profile: trinity
      count: 1
