version: "2.0"

services:
  trinity:
    image: gdubx/trinity-inference:v2-reasoning
    env:
      - PROVIDER_ID=trinity-tier2-balanced
      - MODEL_NAME=llama3.1:8b
      - MODEL_BACKEND=ollama
      - GPU_TYPE=NVIDIA-GPU
      - MAX_QUEUE_SIZE=10
      - OLLAMA_HOST=http://localhost:11434
      # API Keys - REQUIRED: Replace with your own keys before deployment
      # Get Lighthouse key: https://files.lighthouse.storage/
      # Get Brave key: https://brave.com/search/api/
      - LIGHTHOUSE_API_KEY=${LIGHTHOUSE_API_KEY}
      - BRAVE_SEARCH_API_KEY=${BRAVE_SEARCH_API_KEY}
      # Deployment tracking (set by deploy script, used for /funding/status)
      - DEPLOYMENT_TIER=2
      - DEPLOYMENT_TIER_NAME=Standard
      - HOURLY_COST_AKT=0.40
      - DAILY_COST_AKT=9.6
      - SESSION_TYPE=community
    expose:
      - port: 8000
        as: 80
        to:
          - global: true
        http_options:
          read_timeout: 60000
          send_timeout: 60000
          max_body_size: 10485760

profiles:
  compute:
    trinity:
      resources:
        cpu:
          units: 8
        memory:
          size: 32Gi
        storage:
          size: 100Gi
        gpu:
          units: 1
          attributes:
            vendor:
              nvidia:

  placement:
    akash:
      pricing:
        trinity:
          denom: uakt
          amount: 20000

deployment:
  trinity:
    akash:
      profile: trinity
      count: 1
