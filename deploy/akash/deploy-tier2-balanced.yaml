version: "2.0"

services:
  trinity:
    image: gdubx/trinity-inference:latest
    env:
      - PROVIDER_ID=trinity-tier2-balanced
      - MODEL_NAME=llama3.1:8b
      - MODEL_BACKEND=ollama
      - GPU_TYPE=NVIDIA-GPU
      - MAX_QUEUE_SIZE=10
      - OLLAMA_HOST=http://localhost:11434
      - LIGHTHOUSE_API_KEY=cac651de.89f60066a4434ee98844288e220ad6dc
    expose:
      - port: 8000
        as: 80
        to:
          - global: true

profiles:
  compute:
    trinity:
      resources:
        cpu:
          units: 8
        memory:
          size: 32Gi
        storage:
          size: 100Gi
        gpu:
          units: 1
          attributes:
            vendor:
              nvidia:

  placement:
    akash:
      pricing:
        trinity:
          denom: uakt
          amount: 20000

deployment:
  trinity:
    akash:
      profile: trinity
      count: 1
