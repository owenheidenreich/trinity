version: "2.0"

services:
  trinity-mixtral8x22b:
    image: gdubx/trinity-inference:v2-20260124-182612
    env:
      - PROVIDER_ID=trinity-mixtral8x22b
      - MODEL_NAME=mixtral:8x22b
      - MODEL_BACKEND=ollama
      - GPU_TYPE=NVIDIA-A100
      - MAX_QUEUE_SIZE=5
      - OLLAMA_HOST=http://localhost:11434
      - LIGHTHOUSE_API_KEY=cac651de.89f60066a4434ee98844288e220ad6dc
    expose:
      - port: 8000
        as: 80
        to:
          - global: true

profiles:
  compute:
    trinity-mixtral8x22b:
      resources:
        cpu:
          units: 16
        memory:
          size: 200Gi
        storage:
          size: 120Gi
        gpu:
          units: 2
          attributes:
            vendor:
              nvidia:
                - model: a100

  placement:
    akash:
      pricing:
        trinity-mixtral8x22b:
          denom: uakt
          amount: 50000   # ~$50/month

deployment:
  trinity-mixtral8x22b:
    akash:
      profile: trinity-mixtral8x22b
      count: 1
