version: "2.0"

# ============================================================================
# Trinity Test: Qwen2.5-Coder 7B
# ============================================================================
#
# Cheap deploy for smoke-testing before committing to production GPU costs.
# Same model family as production (qwen2.5-coder), just smaller.
#
# Model: Qwen2.5-Coder 7B (~4.5GB)
# Cost: ~$0.05-0.15/hour (~$40-100/month)
# GPU: Any NVIDIA GPU (T4, RTX 3090, 4090, A10, etc.)
#
# Deploy:
#   ./scripts/trinity-deploy-production.sh test
# ============================================================================

services:
  trinity:
    image: gdubx/trinity-inference:v2-20260215-181347
    env:
      - PROVIDER_ID=trinity-test-qwen25-coder-7b
      - MODEL_NAME=qwen2.5-coder:7b
      - MODEL_BACKEND=ollama
      - GPU_TYPE=NVIDIA-GPU
      - MAX_QUEUE_SIZE=10
      - OLLAMA_HOST=http://localhost:11434
      # RAG & Semantic Memory
      - EMBEDDING_MODEL=BAAI/bge-small-en-v1.5
      - RAG_TOP_K=5
      - RAG_CHUNK_SIZE=512
      - RAG_CHUNK_OVERLAP=50
      - WORKING_MEMORY_SIZE=5
      - SEMANTIC_MEMORY_SIZE=8
      - PROFILE_TOKEN_BUDGET=2500
      - RECENCY_WEIGHT=0.3
      # Tool Use & Code Execution
      - CODE_EXECUTION_ENABLED=false
      - CODE_EXECUTION_TIMEOUT=5
      # API Keys - Injected from .env at deployment time
      - LIGHTHOUSE_API_KEY=${LIGHTHOUSE_API_KEY}
      - BRAVE_SEARCH_API_KEY=${BRAVE_SEARCH_API_KEY}
      # Deployment tracking
      - DEPLOYMENT_TIER=test
      - DEPLOYMENT_TIER_NAME=Test
      - HOURLY_COST_AKT=0.15
      - DAILY_COST_AKT=3.6
      - SESSION_TYPE=community
    params:
      storage:
        models:
          mount: /home/trinity/.ollama
          readMode: false
    expose:
      - port: 8000
        as: 80
        to:
          - global: true
        http_options:
          read_timeout: 60000
          send_timeout: 60000
          max_body_size: 52428800

profiles:
  compute:
    trinity:
      resources:
        cpu:
          units: 4
        memory:
          size: 16Gi
        storage:
          - size: 10Gi
          - name: models
            size: 30Gi
            attributes:
              persistent: true
              class: beta3
        gpu:
          units: 1
          attributes:
            vendor:
              nvidia:

  placement:
    akash:
      pricing:
        trinity:
          denom: uakt
          amount: 100000

deployment:
  trinity:
    akash:
      profile: trinity
      count: 1
