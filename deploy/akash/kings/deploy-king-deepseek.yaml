version: "2.0"

# ============================================================================
# WAR OF THE KINGS: DeepSeek Dragon (deepseek-v2.5)
# ============================================================================
# 
# The dark horse - Chinese lab's MoE architecture champion
# Strongest at: Math, coding, technical reasoning
# Note: Using v2.5 (236B MoE) as v3 (685B) needs multi-GPU
# Requires: A100 80GB or H100
# Cost: ~$1.50-2.00/hour
#
# ============================================================================

services:
  trinity:
    image: gdubx/trinity-inference:v4-intelligence
    env:
      - PROVIDER_ID=king-deepseek
      - MODEL_NAME=deepseek-v2.5:236b
      - MODEL_BACKEND=ollama
      - GPU_TYPE=A100-80GB
      - MAX_QUEUE_SIZE=5
      - OLLAMA_HOST=http://localhost:11434
      # Disable multi-model for pure benchmark
      - MULTI_MODEL_ENABLED=false
      - FAST_MODEL=deepseek-v2.5:236b
      - SMART_MODEL=deepseek-v2.5:236b
      - REASONING_MODEL=deepseek-v2.5:236b
      # RAG & Semantic Memory
      - EMBEDDING_MODEL=BAAI/bge-small-en-v1.5
      - RAG_TOP_K=5
      - CODE_EXECUTION_ENABLED=false
      - CODE_EXECUTION_TIMEOUT=5
      - VOTING_ENABLED=false
      # API Keys
      - LIGHTHOUSE_API_KEY=${LIGHTHOUSE_API_KEY}
      - BRAVE_SEARCH_API_KEY=${BRAVE_SEARCH_API_KEY}
      # King identification
      - DEPLOYMENT_TIER=KING
      - DEPLOYMENT_TIER_NAME=DeepSeek-Dragon
      - HOURLY_COST_AKT=1.75
    expose:
      - port: 8000
        as: 80
        to:
          - global: true
        http_options:
          read_timeout: 120000
          send_timeout: 120000
          max_body_size: 52428800

profiles:
  compute:
    trinity:
      resources:
        cpu:
          units: 8
        memory:
          size: 96Gi
        storage:
          size: 150Gi
        gpu:
          units: 1
          attributes:
            vendor:
              nvidia:
                - model: a100
                  ram: 80Gi

  placement:
    akash:
      pricing:
        trinity:
          denom: uakt
          amount: 150000

deployment:
  trinity:
    akash:
      profile: trinity
      count: 1
