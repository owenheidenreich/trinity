version: "2.0"

services:
  trinity-llama70b:
    image: gdubx/trinity-inference:icp-consensus
    env:
      - PROVIDER_ID=trinity-llama70b
      - MODEL_NAME=llama3.1:70b
      - MODEL_BACKEND=ollama
      - GPU_TYPE=NVIDIA-A100
      - MAX_QUEUE_SIZE=5
      - OLLAMA_HOST=http://localhost:11434
      - LIGHTHOUSE_API_KEY=cac651de.89f60066a4434ee98844288e220ad6dc
    expose:
      - port: 8000
        as: 80
        to:
          - global: true

profiles:
  compute:
    trinity-llama70b:
      resources:
        cpu:
          units: 16
        memory:
          size: 180Gi
        storage:
          size: 100Gi
        gpu:
          units: 2
          attributes:
            vendor:
              nvidia:
                - model: a100

  placement:
    akash:
      pricing:
        trinity-llama70b:
          denom: uakt
          amount: 50000   # ~$50/month

deployment:
  trinity-llama70b:
    akash:
      profile: trinity-llama70b
      count: 1
