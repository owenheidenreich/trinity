version: "2.0"

services:
  trinity-qwen72b:
    image: gdubx/trinity-inference:v2-20260126-153616
    env:
      - PROVIDER_ID=trinity-qwen72b
      - MODEL_NAME=qwen2.5:72b
      - MODEL_BACKEND=ollama
      - GPU_TYPE=NVIDIA-A100
      - MAX_QUEUE_SIZE=5
      - OLLAMA_HOST=http://localhost:11434
      - LIGHTHOUSE_API_KEY=cac651de.89f60066a4434ee98844288e220ad6dc
    expose:
      - port: 8000
        as: 80
        to:
          - global: true

profiles:
  compute:
    trinity-qwen72b:
      resources:
        cpu:
          units: 16  # More CPU for faster processing
        memory:
          size: 180Gi  # Need enough RAM for 70B model
        storage:
          size: 100Gi  # 70B model is ~40GB
        gpu:
          units: 1
          attributes:
            vendor:
              nvidia:
                - model: a100  # A100 80GB preferred
  
  placement:
    akash:
      pricing:
        trinity-qwen72b:
          denom: uakt
          amount: 50000  # ~50 AKT/month (~$50)

deployment:
  trinity-qwen72b:
    akash:
      profile: trinity-qwen72b
      count: 1
