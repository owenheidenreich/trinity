version: "2.0"

# ============================================================================
# Trinity Tier 1: Test/Development (TinyLlama 1.1B)
# ============================================================================
# 
# Purpose: Cheap testing for infrastructure, auth, storage features
# Model: TinyLlama 1.1B (636MB)
# Cost: ~$0.05-0.15/hour (~$40-100/month)
# Response Time: 1-3 seconds
# Intelligence: Basic (good enough for testing)
#
# GPU Selection: T4/RTX3090/4090/A10 - filters to reliable providers
# ============================================================================

services:
  trinity:
    image: gdubx/trinity-inference:v2-20260126-153616
    env:
      - PROVIDER_ID=trinity-tier1-test
      - MODEL_NAME=tinyllama:1.1b
      - MODEL_BACKEND=ollama
      - GPU_TYPE=NVIDIA-GPU
      - MAX_QUEUE_SIZE=10
      - OLLAMA_HOST=http://localhost:11434
      - LIGHTHOUSE_API_KEY=cac651de.89f60066a4434ee98844288e220ad6dc
    expose:
      - port: 8000
        as: 80
        to:
          - global: true

profiles:
  compute:
    trinity:
      resources:
        cpu:
          units: 4
        memory:
          size: 16Gi
        storage:
          size: 50Gi
        gpu:
          units: 1
          attributes:
            vendor:
              nvidia:
                - model: t4
                - model: rtx3090
                - model: rtx4090
                - model: a10

  placement:
    akash:
      pricing:
        trinity:
          denom: uakt
          amount: 10000

deployment:
  trinity:
    akash:
      profile: trinity
      count: 1
