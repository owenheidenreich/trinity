version: "2.0"

# ============================================================================
# Trinity Tier 1: Test/Development (TinyLlama 1.1B)
# ============================================================================
# 
# Purpose: Cheap testing for infrastructure, auth, storage features
# Model: TinyLlama 1.1B (636MB)
# Cost: ~$0.05-0.15/hour (~$40-100/month)
# Response Time: 1-3 seconds
# Intelligence: Basic (good enough for testing)
#
# GPU Selection: T4/RTX3090/4090/A10 - filters to reliable providers
# ============================================================================

services:
  trinity:
    image: gdubx/trinity-inference:v2-20260212-041706
    env:
      - PROVIDER_ID=trinity-tier1-test
      - MODEL_NAME=tinyllama:1.1b
      - MODEL_BACKEND=ollama
      - GPU_TYPE=NVIDIA-GPU
      - MAX_QUEUE_SIZE=10
      - OLLAMA_HOST=http://localhost:11434
      # Multi-Model DISABLED for Tier 1 (single model only)
      - MULTI_MODEL_ENABLED=false
      # RAG & Semantic Memory (v4.0) - still enabled for Tier 1
      - EMBEDDING_MODEL=BAAI/bge-small-en-v1.5
      - RAG_TOP_K=5
      - RAG_CHUNK_SIZE=512
      - RAG_CHUNK_OVERLAP=50
      - WORKING_MEMORY_SIZE=3
      - SEMANTIC_MEMORY_SIZE=5
      - RECENCY_WEIGHT=0.3
      # Tool Use & Code Execution (v4.0)
      - CODE_EXECUTION_ENABLED=false
      - CODE_EXECUTION_TIMEOUT=5
      # Voting DISABLED for Tier 1 (too slow with small model)
      - VOTING_ENABLED=false
      # API Keys - Injected from .env at deployment time
      - LIGHTHOUSE_API_KEY=${LIGHTHOUSE_API_KEY}
      - BRAVE_SEARCH_API_KEY=${BRAVE_SEARCH_API_KEY}
      # Deployment tracking (set by deploy script, used for /funding/status)
      - DEPLOYMENT_TIER=1
      - DEPLOYMENT_TIER_NAME=Starter
      - HOURLY_COST_AKT=0.15
      - DAILY_COST_AKT=3.6
      - SESSION_TYPE=community
    params:
      storage:
        models:
          mount: /home/trinity/.ollama
          readMode: false
    expose:
      - port: 8000
        as: 80
        to:
          - global: true
        http_options:
          read_timeout: 60000
          send_timeout: 60000
          max_body_size: 10485760

profiles:
  compute:
    trinity:
      resources:
        cpu:
          units: 4
        memory:
          size: 16Gi
        storage:
          - size: 10Gi
          - name: models
            size: 20Gi
            attributes:
              persistent: true
              class: beta3
        gpu:
          units: 1
          attributes:
            vendor:
              nvidia:

  placement:
    akash:
      pricing:
        trinity:
          denom: uakt
          amount: 10000

deployment:
  trinity:
    akash:
      profile: trinity
      count: 1
