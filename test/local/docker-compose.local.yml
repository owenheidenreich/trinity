version: '3.8'

services:
  ollama:
    image: ollama/ollama:latest
    container_name: trinity-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 10s
      timeout: 5s
      retries: 5

  trinity-backend:
    image: gdubx/trinity-inference:v2-20260120-222616
    container_name: trinity-backend
    ports:
      - "8000:8000"
    environment:
      - PROVIDER_ID=local-docker
      - MODEL_NAME=tinyllama:1.1b
      - GPU_TYPE=CPU
      - MAX_QUEUE_SIZE=5
      - OLLAMA_HOST=http://ollama:11434
      - CHATS_DIR=/app/chats
      - FILECOIN_API_KEY=${FILECOIN_API_KEY}
    volumes:
      - ./chats-local:/app/chats
    depends_on:
      ollama:
        condition: service_healthy
    restart: unless-stopped

volumes:
  ollama-data:
