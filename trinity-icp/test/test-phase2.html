<!DOCTYPE html>
<html>
<head>
    <title>Trinity Auth Phase 2 Test</title>
    <style>
        body {
            font-family: 'Courier New', monospace;
            background: #1e1e1e;
            color: #fff;
            padding: 40px;
            max-width: 1200px;
            margin: 0 auto;
        }
        h1 { color: #4CAF50; }
        button {
            background: #4CAF50;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            margin: 5px;
        }
        button:disabled {
            background: #666;
            cursor: not-allowed;
        }
        .test-section {
            background: #2d2d2d;
            padding: 20px;
            margin: 20px 0;
            border-radius: 8px;
        }
        .result {
            background: #1a1a1a;
            padding: 15px;
            border-radius: 6px;
            margin: 10px 0;
            border-left: 4px solid #4CAF50;
            white-space: pre-wrap;
            word-break: break-all;
            font-size: 12px;
        }
        .result.error {
            border-left-color: #f44336;
        }
        .result.success {
            border-left-color: #4CAF50;
        }
    </style>
</head>
<body>
    <h1>🔐 Trinity Authentication Phase 2 Test</h1>
    <p>Complete end-to-end test of ICP signature verification</p>
    
    <div class="test-section">
        <h2>Step 1: Create Identity</h2>
        <button onclick="createIdentity()">Generate Test Identity</button>
        <div id="identity-result"></div>
    </div>
    
    <div class="test-section">
        <h2>Step 2: Test Signature Verification</h2>
        <button id="test-verify-btn" onclick="testVerify()" disabled>Test /test/verify Endpoint</button>
        <div id="verify-result"></div>
    </div>
    
    <div class="test-section">
        <h2>Step 3: Test Protected Endpoint</h2>
        <button id="test-protected-btn" onclick="testProtected()" disabled>Test @require_auth Decorator</button>
        <div id="protected-result"></div>
    </div>
    
    <div class="test-section">
        <h2>Step 4: Test Multiple Endpoints</h2>
        <button id="test-multiple-btn" onclick="testMultiple()" disabled>Test 5 Different Endpoints</button>
        <div id="multiple-result"></div>
    </div>

    <script src="src/trinity_frontend/assets/icp-auth.js"></script>
    <script>
        let testIdentity = null;
        let testPrincipal = null;

        async function createIdentity() {
            const resultDiv = document.getElementById('identity-result');
            resultDiv.innerHTML = '<div class="result">Creating identity...</div>';
            
            try {
                const { Ed25519KeyIdentity } = window.ICPAuth;
                testIdentity = Ed25519KeyIdentity.generate();
                testPrincipal = testIdentity.getPrincipal().toText();
                
                // Get public key
                const publicKeyDer = testIdentity.getPublicKey().toDer();
                const rawPublicKey = publicKeyDer.slice(-32);
                const publicKeyHex = Array.from(rawPublicKey)
                    .map(b => b.toString(16).padStart(2, '0'))
                    .join('');
                
                resultDiv.innerHTML = `<div class="result success">✅ Identity Created

Principal: ${testPrincipal}
Public Key: ${publicKeyHex}
Public Key Length: ${publicKeyHex.length} chars (${rawPublicKey.length} bytes)</div>`;
                
                // Enable test buttons
                document.getElementById('test-verify-btn').disabled = false;
                document.getElementById('test-protected-btn').disabled = false;
                document.getElementById('test-multiple-btn').disabled = false;
            } catch (error) {
                resultDiv.innerHTML = `<div class="result error">❌ Error: ${error.message}</div>`;
            }
        }

        async function signMessage(message) {
            if (!testIdentity) {
                throw new Error('Create identity first');
            }
            
            const encoder = new TextEncoder();
            const messageBytes = encoder.encode(message);
            const signature = await testIdentity.sign(messageBytes);
            return Array.from(signature)
                .map(b => b.toString(16).padStart(2, '0'))
                .join('');
        }

        function getPublicKeyHex() {
            const publicKeyDer = testIdentity.getPublicKey().toDer();
            const rawPublicKey = publicKeyDer.slice(-32);
            return Array.from(rawPublicKey)
                .map(b => b.toString(16).padStart(2, '0'))
                .join('');
        }

        async function testVerify() {
            const resultDiv = document.getElementById('verify-result');
            resultDiv.innerHTML = '<div class="result">Testing signature verification...</div>';
            
            try {
                const endpoint = '/test/verify';
                const timestamp = Date.now().toString();
                const message = `${testPrincipal}:${timestamp}:${endpoint}`;
                const signature = await signMessage(message);
                const publicKey = getPublicKeyHex();
                
                console.log('📤 Sending request:', {
                    endpoint,
                    message,
                    principal: testPrincipal,
                    timestamp,
                    signature: signature.substring(0, 32) + '...',
                    publicKey: publicKey.substring(0, 32) + '...'
                });
                
                const response = await fetch('http://localhost:5001' + endpoint, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'ICP-Principal': testPrincipal,
                        'ICP-Signature': signature,
                        'ICP-Timestamp': timestamp,
                        'ICP-PublicKey': publicKey
                    },
                    body: JSON.stringify({ test: true })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    resultDiv.innerHTML = `<div class="result success">✅ Signature Verified!

${JSON.stringify(data, null, 2)}</div>`;
                } else {
                    resultDiv.innerHTML = `<div class="result error">❌ Verification Failed

${JSON.stringify(data, null, 2)}</div>`;
                }
            } catch (error) {
                resultDiv.innerHTML = `<div class="result error">❌ Error: ${error.message}</div>`;
                console.error('Request failed:', error);
            }
        }

        async function testProtected() {
            const resultDiv = document.getElementById('protected-result');
            resultDiv.innerHTML = '<div class="result">Testing protected endpoint...</div>';
            
            try {
                const endpoint = '/test/protected';
                const timestamp = Date.now().toString();
                const message = `${testPrincipal}:${timestamp}:${endpoint}`;
                const signature = await signMessage(message);
                const publicKey = getPublicKeyHex();
                
                const response = await fetch('http://localhost:5001' + endpoint, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'ICP-Principal': testPrincipal,
                        'ICP-Signature': signature,
                        'ICP-Timestamp': timestamp,
                        'ICP-PublicKey': publicKey
                    },
                    body: JSON.stringify({ data: 'test' })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    resultDiv.innerHTML = `<div class="result success">✅ Protected Endpoint Accessed!

${JSON.stringify(data, null, 2)}</div>`;
                } else {
                    resultDiv.innerHTML = `<div class="result error">❌ Access Denied

${JSON.stringify(data, null, 2)}</div>`;
                }
            } catch (error) {
                resultDiv.innerHTML = `<div class="result error">❌ Error: ${error.message}</div>`;
            }
        }

        async function testMultiple() {
            const resultDiv = document.getElementById('multiple-result');
            resultDiv.innerHTML = '<div class="result">Testing multiple endpoints...</div>';
            
            const endpoints = [
                '/test/verify',
                '/test/protected',
                '/test/verify',
                '/test/protected',
                '/test/verify'
            ];
            
            let results = [];
            
            for (let i = 0; i < endpoints.length; i++) {
                const endpoint = endpoints[i];
                try {
                    const timestamp = Date.now().toString();
                    const message = `${testPrincipal}:${timestamp}:${endpoint}`;
                    const signature = await signMessage(message);
                    const publicKey = getPublicKeyHex();
                    
                    const response = await fetch('http://localhost:5001' + endpoint, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'ICP-Principal': testPrincipal,
                            'ICP-Signature': signature,
                            'ICP-Timestamp': timestamp,
                            'ICP-PublicKey': publicKey
                        },
                        body: JSON.stringify({ test: i + 1 })
                    });
                    
                    const data = await response.json();
                    results.push({
                        test: i + 1,
                        endpoint,
                        success: data.success,
                        status: response.status
                    });
                    
                    // Small delay between requests
                    await new Promise(r => setTimeout(r, 100));
                } catch (error) {
                    results.push({
                        test: i + 1,
                        endpoint,
                        success: false,
                        error: error.message
                    });
                }
            }
            
            const allPassed = results.every(r => r.success);
            const className = allPassed ? 'success' : 'error';
            const icon = allPassed ? '✅' : '❌';
            
            resultDiv.innerHTML = `<div class="result ${className}">${icon} ${results.filter(r => r.success).length}/${results.length} Tests Passed

${JSON.stringify(results, null, 2)}</div>`;
        }
    </script>
</body>
</html>
