<!DOCTYPE html>
<html>
<head>
    <title>Trinity Auth Signing Test</title>
    <style>
        body {
            font-family: 'Courier New', monospace;
            background: #1e1e1e;
            color: #fff;
            padding: 40px;
            max-width: 900px;
            margin: 0 auto;
        }
        h1 {
            color: #4CAF50;
            border-bottom: 2px solid #4CAF50;
            padding-bottom: 10px;
        }
        .test-section {
            background: #2d2d2d;
            padding: 20px;
            margin: 20px 0;
            border-radius: 8px;
            border-left: 4px solid #4CAF50;
        }
        button {
            background: #4CAF50;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            margin: 5px;
        }
        button:hover {
            background: #45a049;
        }
        .result {
            background: #1a1a1a;
            padding: 15px;
            border-radius: 6px;
            margin: 10px 0;
            border: 1px solid #444;
            word-break: break-all;
        }
        .success {
            border-left: 4px solid #4CAF50;
        }
        .error {
            border-left: 4px solid #f44336;
        }
        .info {
            border-left: 4px solid #2196F3;
        }
    </style>
</head>
<body>
    <h1>🔐 Trinity Authentication Signing Test</h1>
    
    <div class="test-section">
        <h2>Step 1: Generate Test Identity</h2>
        <button onclick="generateTestIdentity()">Generate Identity</button>
        <div id="identity-result"></div>
    </div>
    
    <div class="test-section">
        <h2>Step 2: Sign Test Messages</h2>
        <button onclick="signTestMessage()">Sign Message: "test:1234:/generate"</button>
        <button onclick="signMultiple()">Sign 5 Different Messages</button>
        <div id="signing-result"></div>
    </div>
    
    <div class="test-section">
        <h2>Step 3: Verify Signature Format</h2>
        <button onclick="verifyFormat()">Verify Hex Format</button>
        <div id="format-result"></div>
    </div>
    
    <div class="test-section">
        <h2>Step 4: Export Test Vectors</h2>
        <button onclick="exportTestVectors()">Export for Backend Testing</button>
        <div id="export-result"></div>
    </div>

    <script src="src/trinity_frontend/assets/icp-auth.js"></script>
    <script>
        let testIdentity = null;
        let testPrincipal = null;
        let testSignatures = [];

        async function generateTestIdentity() {
            const resultDiv = document.getElementById('identity-result');
            resultDiv.innerHTML = '<div class="result info">Generating identity...</div>';
            
            try {
                const { Ed25519KeyIdentity } = window.ICPAuth;
                testIdentity = Ed25519KeyIdentity.generate();
                testPrincipal = testIdentity.getPrincipal().toText();
                
                const privateKey = Array.from(testIdentity.getKeyPair().secretKey)
                    .map(b => b.toString(16).padStart(2, '0'))
                    .join('');
                
                resultDiv.innerHTML = `
                    <div class="result success">
                        <strong>✅ Identity Generated</strong><br><br>
                        <strong>Principal:</strong><br>${testPrincipal}<br><br>
                        <strong>Private Key (hex):</strong><br>${privateKey.substring(0, 64)}...<br><br>
                        <strong>Key Length:</strong> ${privateKey.length} characters
                    </div>
                `;
            } catch (error) {
                resultDiv.innerHTML = `
                    <div class="result error">
                        <strong>❌ Failed:</strong> ${error.message}
                    </div>
                `;
            }
        }

        async function signMessage(message) {
            if (!testIdentity) {
                throw new Error('Generate identity first');
            }
            
            const encoder = new TextEncoder();
            const messageBytes = encoder.encode(message);
            const signature = await testIdentity.sign(messageBytes);
            const signatureHex = Array.from(signature)
                .map(b => b.toString(16).padStart(2, '0'))
                .join('');
            
            return signatureHex;
        }

        async function signTestMessage() {
            const resultDiv = document.getElementById('signing-result');
            resultDiv.innerHTML = '<div class="result info">Signing message...</div>';
            
            try {
                const message = "test:1234:/generate";
                const signature = await signMessage(message);
                
                resultDiv.innerHTML = `
                    <div class="result success">
                        <strong>✅ Message Signed</strong><br><br>
                        <strong>Message:</strong> ${message}<br><br>
                        <strong>Signature:</strong><br>${signature}<br><br>
                        <strong>Signature Length:</strong> ${signature.length} characters
                    </div>
                `;
                
                testSignatures.push({ message, signature });
            } catch (error) {
                resultDiv.innerHTML = `
                    <div class="result error">
                        <strong>❌ Failed:</strong> ${error.message}
                    </div>
                `;
            }
        }

        async function signMultiple() {
            const resultDiv = document.getElementById('signing-result');
            resultDiv.innerHTML = '<div class="result info">Signing multiple messages...</div>';
            
            try {
                const messages = [
                    `${testPrincipal}:${Date.now()}:/chat/autosave`,
                    `${testPrincipal}:${Date.now()}:/chat/list`,
                    `${testPrincipal}:${Date.now()}:/generate`,
                    `${testPrincipal}:${Date.now()}:/chat/archive`,
                    `${testPrincipal}:${Date.now()}:/chat/delete`
                ];
                
                let html = '<div class="result success"><strong>✅ Signed 5 Messages</strong><br><br>';
                testSignatures = [];
                
                for (const message of messages) {
                    const signature = await signMessage(message);
                    testSignatures.push({ message, signature });
                    html += `<strong>Message:</strong> ${message.substring(0, 60)}...<br>`;
                    html += `<strong>Signature:</strong> ${signature.substring(0, 32)}...<br><br>`;
                }
                
                html += '</div>';
                resultDiv.innerHTML = html;
            } catch (error) {
                resultDiv.innerHTML = `
                    <div class="result error">
                        <strong>❌ Failed:</strong> ${error.message}
                    </div>
                `;
            }
        }

        function verifyFormat() {
            const resultDiv = document.getElementById('format-result');
            
            if (testSignatures.length === 0) {
                resultDiv.innerHTML = '<div class="result error">Sign some messages first</div>';
                return;
            }
            
            let allValid = true;
            let html = '<div class="result success">';
            
            for (const { message, signature } of testSignatures) {
                const isHex = /^[0-9a-f]+$/i.test(signature);
                const isExpectedLength = signature.length === 128; // Ed25519 signature is 64 bytes = 128 hex chars
                
                if (!isHex || !isExpectedLength) {
                    allValid = false;
                }
                
                html += `<strong>Signature:</strong> ${signature.substring(0, 32)}...<br>`;
                html += `<strong>Valid Hex:</strong> ${isHex ? '✅' : '❌'}<br>`;
                html += `<strong>Correct Length (128):</strong> ${isExpectedLength ? '✅' : '❌'} (actual: ${signature.length})<br><br>`;
            }
            
            html += `<strong>${allValid ? '✅ All signatures valid format' : '❌ Some signatures invalid'}</strong></div>`;
            resultDiv.innerHTML = html;
        }

        function exportTestVectors() {
            const resultDiv = document.getElementById('export-result');
            
            if (!testIdentity || testSignatures.length === 0) {
                resultDiv.innerHTML = '<div class="result error">Generate identity and sign messages first</div>';
                return;
            }
            
            const testVectors = {
                principal: testPrincipal,
                publicKey: Array.from(testIdentity.getPublicKey().toDer())
                    .map(b => b.toString(16).padStart(2, '0'))
                    .join(''),
                signatures: testSignatures
            };
            
            const json = JSON.stringify(testVectors, null, 2);
            
            resultDiv.innerHTML = `
                <div class="result success">
                    <strong>✅ Test Vectors Ready</strong><br><br>
                    <button onclick="copyToClipboard('${btoa(json)}')">📋 Copy JSON</button>
                    <button onclick="downloadTestVectors('${btoa(json)}')">💾 Download JSON</button>
                    <br><br>
                    <textarea readonly style="width: 100%; height: 200px; background: #1a1a1a; color: #fff; border: 1px solid #444; padding: 10px; font-family: monospace; font-size: 11px;">${json}</textarea>
                </div>
            `;
        }

        function copyToClipboard(base64Data) {
            const json = atob(base64Data);
            navigator.clipboard.writeText(json).then(() => {
                alert('✅ Copied to clipboard!');
            });
        }

        function downloadTestVectors(base64Data) {
            const json = atob(base64Data);
            const blob = new Blob([json], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'trinity-test-vectors.json';
            a.click();
        }
    </script>
</body>
</html>
