    ⚠️ DEVELOPMENT ONLY - DO NOT USE DIRECTLY
    This file requires an HTTP server (npm run dev or Python server)
    For production/offline use: open dist/index.html
-->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <meta name="app-version" content="2.0.1">
    <title>Trinity</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="app-container">
        <div class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <div class="sidebar-title">Trinity <a href="#" class="about-link" data-action="showAbout">About</a></div>
                <button class="toggle-btn" onclick="toggleSidebar()">☰</button>
            </div>

            <div class="status-panel" id="statusPanel">
                <!-- Connection Status with Logout -->
                <div class="status-header">
                    <div style="display: flex; align-items: center; gap: 8px;">
                        <div class="status-dot" id="statusDot"></div>
                        <span id="statusText">Connecting...</span>
                    </div>
                    <button id="logoutBtn" class="logout-btn" style="display: none;">Logout</button>
                </div>
                
                <!-- Infrastructure Stack - Compact Row -->
                <div class="infra-stack" id="infraStack">
                    <a href="#" class="infra-btn" id="icpStatus" title="Frontend · ICP&#10;zc67k-kiaaa-aaaal-qtmiq-cai">
                        <span class="infra-icon">◈</span>
                        <span class="infra-label">ICP</span>
                        <span class="infra-status" id="icpIndicator">●</span>
                    </a>
                    <a href="#" class="infra-btn" id="akashStatus" title="Compute · Akash">
                        <span class="infra-icon">☁</span>
                        <span class="infra-label">Akash</span>
                        <span class="infra-status" id="akashIndicator">●</span>
                    </a>
                    <a href="#" class="infra-btn" id="filecoinStatus" title="Storage · Filecoin&#10;Lighthouse SDK → IPFS">
                        <span class="infra-icon">◉</span>
                        <span class="infra-label">Filecoin</span>
                        <span class="infra-status" id="filecoinIndicator">●</span>
                    </a>
                </div>
                
                <!-- Model Info -->
                <a href="#" class="model-badge" id="modelBadge">
                    <span class="model-label">Model</span>
                    <span class="model-name" id="modelName">Loading...</span>
                </a>
                
                <!-- Funding Transparency Panel -->
                <div class="funding-panel" id="fundingPanel">
                    <div class="funding-header">
                        <span class="funding-title">Community LLM</span>
                        <a href="#" class="donate-link" id="donateLink">Donate</a>
                    </div>
                    <div class="funding-progress">
                        <div class="funding-bar">
                            <div class="funding-fill" id="fundingFill" style="width: 0%"></div>
                        </div>
                    </div>
                    <div class="funding-details">
                        <span class="funding-time" id="fundingTime">Loading...</span>
                        <span class="funding-cost" id="fundingCost"></span>
                    </div>
                </div>
            </div>

            <div class="sidebar-content" id="sidebarContent">
                <!-- Content rendered dynamically by UI.renderSidebar() -->
            </div>
        </div>

        <div class="main-content">
            <button class="toggle-sidebar-btn" onclick="toggleSidebar()">☰</button>

            <!-- Main Chat Area -->
            <div class="chat-area" id="chatArea">
                <div class="archive-cid-badge" id="archiveCidBadge" style="display: none;">
                    <a href="#" id="cidLink" class="cid-link">CID: <span id="cidText"></span></a>
                </div>
                <div class="empty-state" id="emptyState">
                    <h1 id="chatTitle">Trinity</h1>
                </div>
                <div class="messages-container" id="messagesContainer"></div>
            </div>
            
            <!-- Attached File Preview -->
            <div class="attached-file-preview" id="attachedFilePreview" style="display: none;">
                <span class="attached-file-name" id="attachedFileName"></span>
                <span class="attached-file-size" id="attachedFileSize"></span>
                <button class="attached-file-remove" id="removeAttachment" title="Remove attachment">×</button>
            </div>
            
            <div class="input-container" id="inputContainer">
                <div class="input-wrapper">
                        <!-- Attach Button with Hidden File Input -->
                        <button class="attach-btn" id="attachBtn" title="Attach file (text, audio)">+</button>
                        <input type="file" id="fileInput" accept=".txt,.md,.json,.pdf,.doc,.docx,audio/*,.mp3,.wav,.m4a,.ogg,.webm" style="display: none;">
                        
                        <textarea id="promptInput" placeholder="Ask anything..." rows="1"
                            onkeydown="handleKeyDown(event)" oninput="autoResize(this)"></textarea>
                        <button class="send-btn" id="sendBtn" onclick="generate()" disabled>➤</button>
                    </div>
                    <div class="input-hint" id="inputHint">
                        <span id="fileLimitHint">Files: text up to 100KB, audio up to 25MB</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/11.1.1/marked.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.0.6/purify.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <!-- Main App -->
    <script type="module" src="/app.js"></script>
</body>
</html>
