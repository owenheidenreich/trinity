<!-- 
    ⚠️ DEVELOPMENT ONLY - DO NOT USE DIRECTLY
    This file requires an HTTP server (npm run dev or Python server)
    For production/offline use: open dist/index.html
-->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <meta name="app-version" content="2.0.1">
    <title>Trinity</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="app-container">
        <div class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <div class="sidebar-title">Trinity <a href="#" class="about-link" data-action="showAbout">About</a></div>
                <button class="toggle-btn" onclick="toggleSidebar()">☰</button>
            </div>

            <div class="status-panel" id="statusPanel">
                <!-- Connection Status with Logout -->
                <div class="status-header">
                    <div style="display: flex; align-items: center; gap: 8px;">
                        <div class="status-dot" id="statusDot"></div>
                        <span id="statusText">Connecting...</span>
                    </div>
                    <button id="logoutBtn" class="logout-btn" style="display: none;">Logout</button>
                </div>
                
                <!-- Infrastructure Stack -->
                <div class="infra-stack" id="infraStack">
                    <!-- ICP -->
                    <a href="#" class="infra-item" id="icpStatus">
                        <div class="infra-icon">◈</div>
                        <div class="infra-details">
                            <div class="infra-label">Frontend · ICP</div>
                            <div class="infra-value"><code>zc67k-kiaaa-aaaal-qtmiq-cai</code></div>
                        </div>
                        <div class="infra-status" id="icpIndicator">●</div>
                    </a>
                    
                    <!-- Akash -->
                    <a href="#" class="infra-item" id="akashStatus">
                        <div class="infra-icon">☁</div>
                        <div class="infra-details">
                            <div class="infra-label">Compute · Akash</div>
                            <div class="infra-value" id="akashProvider">provider.akashprovid.com</div>
                        </div>
                        <div class="infra-status" id="akashIndicator">●</div>
                    </a>
                    
                    <!-- Filecoin -->
                    <a href="#" class="infra-item" id="filecoinStatus">
                        <div class="infra-icon">◉</div>
                        <div class="infra-details">
                            <div class="infra-label">Storage · Filecoin</div>
                            <div class="infra-value">Lighthouse SDK → IPFS</div>
                        </div>
                        <div class="infra-status" id="filecoinIndicator">●</div>
                    </a>
                </div>
                
                <!-- Model Info -->
                <a href="#" class="model-badge" id="modelBadge">
                    <span class="model-label">Model</span>
                    <span class="model-name" id="modelName">Loading...</span>
                </a>
            </div>

            <div class="sidebar-content" id="sidebarContent">
                <!-- Content rendered dynamically by UI.renderSidebar() -->
            </div>
        </div>

        <div class="main-content">
            <button class="toggle-sidebar-btn" onclick="toggleSidebar()">☰</button>

            <div class="chat-area" id="chatArea">
                <!-- CID badge for archived chats (hidden by default) -->
                <div class="archive-cid-badge" id="archiveCidBadge" style="display: none;">
                    <a href="#" id="cidLink" class="cid-link">CID: <span id="cidText"></span></a>
                </div>

                <div class="empty-state" id="emptyState">
                    <h1>Trinity</h1>
                </div>

                <div class="messages-container" id="messagesContainer">
                    </div>
            </div>

            <div class="input-container" id="inputContainer">
                <div class="input-wrapper">
                    <button class="attach-btn" title="Attach file">+</button>
                    <textarea 
                        id="promptInput" 
                        placeholder="Ask anything..."
                        rows="1"
                        onkeydown="handleKeyDown(event)"
                        oninput="autoResize(this)"
                    ></textarea>
                    <button class="send-btn" id="sendBtn" onclick="generate()" disabled>
                        ➤
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/11.1.1/marked.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.0.6/purify.min.js"></script>
    <!-- Main App -->
    <script type="module" src="/app.js"></script>
</body>
</html>
