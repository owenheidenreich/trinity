<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <meta name="app-version" content="2.0.1">
    <!-- Content Security Policy -->
    <meta http-equiv="Content-Security-Policy" content="
        default-src 'self';
        script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdnjs.cloudflare.com https://cdn.jsdelivr.net https://cdn.filestackcontent.com;
        style-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com https://cdn.jsdelivr.net https://fonts.googleapis.com;
        font-src 'self' https://cdn.jsdelivr.net https://fonts.gstatic.com;
        img-src 'self' data: https: blob:;
        connect-src 'self' https://api.dubya.ai https://*.workers.dev https://gateway.lighthouse.storage https://api.lighthouse.storage https://*.icp0.io wss://*.icp0.io https://cdnjs.cloudflare.com;
        frame-src 'none';
        object-src 'none';
        base-uri 'self';
        form-action 'self';
        upgrade-insecure-requests;
    ">
    <title>Trinity - Decentralized AI Chat</title>
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://dubya.ai/">
    <meta property="og:title" content="Trinity - Decentralized AI Chat">
    <meta property="og:description" content="AI chat where you truly own everything. No accounts. No passwords. Your cryptographic keys encrypt your data before it leaves your browser. Built on ICP, Akash, and IPFS.">
    <meta property="og:image" content="https://i.imgur.com/QhMsOML.mp4">
    <meta property="og:video" content="https://i.imgur.com/QhMsOML.mp4">
    <meta property="og:video:type" content="video/mp4">
    
    <!-- Twitter -->
    <meta name="twitter:card" content="player">
    <meta name="twitter:url" content="https://dubya.ai/">
    <meta name="twitter:title" content="Trinity - Decentralized AI Chat">
    <meta name="twitter:description" content="AI chat where you truly own everything. No accounts. No passwords. Your cryptographic keys encrypt your data before it leaves your browser.">
    <meta name="twitter:player" content="https://i.imgur.com/QhMsOML.mp4">
    <meta name="twitter:player:width" content="480">
    <meta name="twitter:player:height" content="480">
    
    <!-- General Meta -->
    <meta name="description" content="AI chat where you truly own everything. No accounts. No passwords. Your cryptographic keys encrypt your data before it leaves your browser. Built on ICP, Akash, and IPFS.">
    <meta name="theme-color" content="#1a1a1a">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="app-container">
        <div class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <div class="sidebar-title">Trinity <a href="#" class="about-link" data-action="showAbout">About</a></div>
                <button class="toggle-btn" onclick="toggleSidebar()">☰</button>
            </div>

            <div class="status-panel" id="statusPanel">
                <!-- Connection Status with Logout -->
                <div class="status-header">
                    <div style="display: flex; align-items: center; gap: 8px;">
                        <div class="status-dot" id="statusDot"></div>
                        <span id="statusText">Connecting...</span>
                    </div>
                    <button id="logoutBtn" class="logout-btn" style="display: none;">Logout</button>
                </div>
                
                <!-- Infrastructure Stack - Compact Row -->
                <div class="infra-stack" id="infraStack">
                    <a href="#" class="infra-btn" id="icpStatus" title="Frontend · ICP&#10;zc67k-kiaaa-aaaal-qtmiq-cai">
                        <span class="infra-icon">◈</span>
                        <span class="infra-label">ICP</span>
                        <span class="infra-status" id="icpIndicator">●</span>
                    </a>
                    <a href="#" class="infra-btn" id="akashStatus" title="Compute · Akash">
                        <span class="infra-icon">☁</span>
                        <span class="infra-label">Akash</span>
                        <span class="infra-status" id="akashIndicator">●</span>
                    </a>
                    <a href="#" class="infra-btn" id="ipfsStatus" title="Storage · IPFS&#10;Lighthouse SDK → Permanent Storage">
                        <span class="infra-icon">◉</span>
                        <span class="infra-label">IPFS</span>
                        <span class="infra-status" id="ipfsIndicator">●</span>
                    </a>
                </div>
                
                <!-- Model Info -->
                <a href="#" class="model-badge" id="modelBadge">
                    <span class="model-label">Model</span>
                    <span class="model-name" id="modelName">Loading...</span>
                </a>
            </div>

            <div class="sidebar-content" id="sidebarContent">
                <!-- Content rendered dynamically by UI.renderSidebar() -->
            </div>
        </div>

        <div class="main-content">
            <button class="toggle-sidebar-btn" onclick="toggleSidebar()">☰</button>

            <!-- Main Chat Area -->
            <div class="chat-area" id="chatArea">
                <div class="empty-state" id="emptyState">
                    <h1 id="chatTitle">Trinity</h1>
                </div>
                <div class="messages-container" id="messagesContainer"></div>
            </div>
            
            <!-- Attached File Preview -->
            <div class="attached-file-preview" id="attachedFilePreview" style="display: none;">
                <span class="attached-file-name" id="attachedFileName"></span>
                <span class="attached-file-size" id="attachedFileSize"></span>
                <button class="attached-file-remove" id="removeAttachment" title="Remove attachment">×</button>
            </div>
            
            <div class="input-container" id="inputContainer">
                <div class="input-wrapper">
                        <!-- Attach Button with Hidden File Input -->
                        <button class="attach-btn" id="attachBtn" title="Attach file">+</button>
                        <input type="file" id="fileInput" accept=".txt,.md,.json,.pdf,.doc,.docx,.py,.js,.ts,.html,.css" style="display: none;">
                        
                        <textarea id="promptInput" placeholder="Ask anything..." rows="1"
                            oninput="autoResize(this)"></textarea>
                        <button class="send-btn" id="sendBtn" disabled>➤</button>
                    </div>
                    <div class="input-hint" id="inputHint">
                        <span id="fileLimitHint">Files: up to 100KB</span>
                    </div>
                </div>
            </div>
        </div>

    </div>

    <!-- CDN Libraries -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/11.1.1/marked.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.0.6/purify.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
    <script>
        // Verify KaTeX loaded correctly
        if (typeof renderMathInElement === 'function') {
            console.log('✅ KaTeX auto-render loaded successfully');
            window.katexReady = true;
        } else {
            console.error('❌ KaTeX auto-render failed to load');
            window.katexReady = false;
        }
    </script>
    <!-- Main App -->
    <script type="module" src="/app.js"></script>
</body>
</html>
