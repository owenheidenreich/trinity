[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = 
    --cov=.
    --cov-report=html
    --cov-report=term-missing
    --cov-fail-under=80
    -v
    --tb=short
asyncio_mode = auto

markers =
    unit: Unit tests (fast, isolated)
    integration: Integration tests (require Flask app)
    security: Security-critical tests (must pass)
    slow: Slow tests (>1s)
    p0: Priority 0 - Critical tests
    p1: Priority 1 - Important tests
    p2: Priority 2 - Nice to have tests

filterwarnings =
    ignore::DeprecationWarning
