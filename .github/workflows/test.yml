name: Trinity CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  # Backend Python tests
  backend-tests:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements.txt
          pip install pytest pytest-cov
      
      - name: Check Python syntax
        run: |
          cd backend
          python -m py_compile inference_server.py
          python -m py_compile config.py
          python -m py_compile encryption.py
          python -m py_compile storage.py
          python -m py_compile lighthouse.py
          python -m py_compile icp_auth.py
      
      - name: Verify module imports
        run: |
          cd backend
          python -c "
          from middleware import rate_limit, icp_idempotent
          from services import TRINITY_SYSTEM_PROMPT, check_ollama_connection
          print('All modules import successfully')
          "
      
      - name: Run unit tests
        run: |
          cd backend
          python -m pytest tests/ -v --tb=short

  # Frontend JavaScript tests
  frontend-tests:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: trinity-icp/package.json
      
      - name: Install dependencies
        run: |
          cd trinity-icp
          npm ci
      
      - name: Run linting
        run: |
          cd trinity-icp
          npm run lint
      
      - name: Run unit tests
        run: |
          cd trinity-icp
          npm test
      
      - name: Build frontend
        run: |
          cd trinity-icp
          npm run build

  # Integration tests (requires both Python and Node)
  integration-tests:
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-tests]
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install backend dependencies
        run: |
          cd backend
          pip install -r requirements.txt
      
      - name: Run integration tests
        run: |
          cd backend
          python -m pytest tests/integration/ -v --tb=short

  # Security checks
  security:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Check for hardcoded secrets
        run: |
          # Check for common secret patterns that shouldn't be committed
          if grep -rE "(LIGHTHOUSE_API_KEY|BRAVE_SEARCH_API_KEY|api_key|secret_key)\s*=\s*['\"][^'\"]{20,}" \
             --include="*.py" --include="*.js" --include="*.ts" \
             --exclude-dir=node_modules --exclude-dir=target; then
            echo "⚠️ WARNING: Possible hardcoded secrets found!"
            exit 1
          else
            echo "✅ No hardcoded secrets detected"
          fi
      
      - name: Check for sensitive files
        run: |
          # Ensure .env files and keys aren't committed
          if ls .env* 2>/dev/null || ls *.pem 2>/dev/null || ls *_key.txt 2>/dev/null; then
            echo "⚠️ WARNING: Sensitive files should not be committed!"
            exit 1
          else
            echo "✅ No sensitive files found"
          fi

      - name: Check docs for staleness
        run: |
          STALE=0
          # Deleted systems referenced as active (not in archive/ or "Deleted" context)
          if grep -rn "complexity\.py\|voting\.py\|experiments\.py\|parallel\.py" \
             docs/ --include="*.md" | grep -v "archive/" | grep -v -i "deleted\|removed\|overhaul"; then
            echo "⚠️ Deleted system referenced in active docs"
            STALE=1
          fi
          # Old model names in active docs
          if grep -rn "TinyLlama\|Llama 3\.1\|Llama 8B" \
             docs/ --include="*.md" | grep -v "archive/"; then
            echo "⚠️ Stale model name in active docs"
            STALE=1
          fi
          # Service count drift
          ACTUAL=$(find backend/services -name "*.py" ! -name "__init__.py" | wc -l | tr -d ' ')
          if grep -rn "17 modules\|17 service" docs/ --include="*.md"; then
            echo "⚠️ Service count stale (actual: $ACTUAL)"
            STALE=1
          fi
          if [ $STALE -eq 0 ]; then
            echo "✅ No documentation staleness detected"
          fi
